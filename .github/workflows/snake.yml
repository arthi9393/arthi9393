name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: arthi9393
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#00D9FF&color_dots=#FFFFFF,#D9FBE5,#88E89F,#39C963,#16A34A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#FFFFFF,#D9FBE5,#88E89F,#39C963,#16A34A

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
