name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
  uses: Platane/snk@v3
  with:
    github_user_name: arthi9393
    outputs: |
      dist/github-snake.svg?color_snake=%2300D9FF&color_dots=%23FFFFFF,%23D9FBE5,%2388E89F,%2339C963,%2316A34A
      dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
