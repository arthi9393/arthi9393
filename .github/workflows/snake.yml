name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: arthi939
            outputs: |
  dist/github-snake.svg?color_snake=%2300FF66&color_dots=%23E8FFF0,%23B8F5C8,%2352D273,%2300B83D,%23007829
  dist/github-snake-dark.svg?color_snake=%2300FF66&color_dots=%230E2A18,%231A6635,%2326A641,%2339D353,%236BFF8A

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
