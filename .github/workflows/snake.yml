name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: arthi939
            outputs: |
  dist/github-snake.svg?color_snake=%2300D9FF&color_dots=%23F2F2F2,%23D9F5E3,%239BE7B1,%2344C767,%2316A34A
  dist/github-snake-dark.svg?color_snake=%2300D9FF&color_dots=%23E8E8E8,%23C8F7D5,%2388E89F,%2339C963,%2316A34A

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
